# 测试环境使用内存 H2，避免依赖本地 MySQL
spring.datasource.url=jdbc:h2:mem:api_service_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,ROLE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

spring.application.name=api-service
app.version=0.0.1-SNAPSHOT

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=assign_id
mybatis-plus.global-config.db-config.logic-delete-field=isDeleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

app.jwt.secret=test-jwt-secret-at-least-32-bytes-long-for-hs256
app.jwt.expiration-ms=3600000

# 测试环境开启沙箱模拟支付，供 RechargeApiIntegrationTest 使用
app.recharge.mock-pay-enabled=true
