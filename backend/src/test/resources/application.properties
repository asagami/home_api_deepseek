# 测试环境使用内存 H2，避免依赖本地 MySQL
spring.datasource.url=jdbc:h2:mem:api_service_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,ROLE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

spring.application.name=api-service
app.version=0.0.1-SNAPSHOT

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=assign_id
mybatis-plus.global-config.db-config.logic-delete-field=isDeleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

app.jwt.secret=test-jwt-secret-at-least-32-bytes-long-for-hs256
app.jwt.expiration-ms=3600000

# 测试环境开启沙箱模拟支付，供 RechargeApiIntegrationTest 使用
app.recharge.mock-pay-enabled=true

# 集成测试会在同一分钟内高频调用登录/注册等匿名接口，调高控制台限流阈值避免误伤
app.ratelimit.console.auth-ip-per-minute=1000000
app.ratelimit.console.ip-per-minute=1000000

# 密码找回：测试中关闭邮件冷却并放宽频控，便于同一测试内连续申请两次重置
app.password-reset.resend-cooling-seconds=0
app.ratelimit.password-reset.ip-per-minute=1000000
app.ratelimit.password-reset.verify-ip-per-minute=1000000
app.ratelimit.password-reset.account-limit=1000000

# 修改密码：同一 IP 在测试中会高频调用，放宽窗口限流（用户锁定阈值保持默认以覆盖用例）
app.ratelimit.password-change.ip-per-15-minutes=1000000
