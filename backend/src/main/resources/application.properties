spring.application.name=api-service
server.port=8080
app.version=0.0.1-SNAPSHOT

# 数据源（MySQL 8）
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/open_api_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=ApiServiceHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# MyBatis-Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=assign_id
mybatis-plus.global-config.db-config.logic-delete-field=isDeleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# JWT，生产环境必须通过环境变量覆盖 secret（至少 32 字节）
app.jwt.secret=${JWT_SECRET:api-service-dev-jwt-secret-change-me-in-production-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# 允许跨域访问的前端地址，多个用逗号分隔
app.cors.allowed-origin-patterns=http://localhost:5173,http://127.0.0.1:5173

# Elasticsearch（新闻检索示例）
app.elasticsearch.url=${ELASTICSEARCH_URL:http://localhost:9200}
app.elasticsearch.username=${ELASTICSEARCH_USERNAME:}
app.elasticsearch.password=${ELASTICSEARCH_PASSWORD:}
app.search.news-index=${NEWS_INDEX:news}

# 第三方 IP 归属地查询上游，默认使用无需密钥的 ipapi.co
app.proxy.ip-geo.base-url=${IP_GEO_BASE_URL:https://ipapi.co}

# 点数充值：二维码地址与订单有效期；mock-pay 默认关闭，仅开发环境手动开启
app.recharge.qr-base-url=${RECHARGE_QR_BASE_URL:https://pay.example.com/qr}
app.recharge.order-ttl-minutes=${RECHARGE_ORDER_TTL_MINUTES:15}
app.recharge.mock-pay-enabled=${RECHARGE_MOCK_PAY_ENABLED:false}

# 限流配置（基于 Redis，多实例共享）
# 控制台匿名认证接口（登录/注册/发码）每 IP 每分钟最大请求数
app.ratelimit.console.auth-ip-per-minute=${RATELIMIT_CONSOLE_AUTH_IP_PER_MINUTE:20}
# 控制台其余接口每 IP 每分钟最大请求数
app.ratelimit.console.ip-per-minute=${RATELIMIT_CONSOLE_IP_PER_MINUTE:120}
# 登录失败锁定：连续失败 N 次后锁定
app.ratelimit.login.max-failures=${RATELIMIT_LOGIN_MAX_FAILURES:5}
# 登录锁定时长（分钟）
app.ratelimit.login.lockout-minutes=${RATELIMIT_LOGIN_LOCKOUT_MINUTES:15}
# 邮箱验证码最大尝试次数
app.ratelimit.email-code.max-attempts=${RATELIMIT_EMAIL_CODE_MAX_ATTEMPTS:5}
# 每用户最多可创建的 API Key 数量
app.apikey.max-per-user=${APIKEY_MAX_PER_USER:5}
# 单个 API Key 的 QPS 上限
app.apikey.max-qps=${APIKEY_MAX_QPS:20}

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
