# 生产环境 profile 覆盖配置
# 激活方式：--spring.profiles.active=prod
#
# 本文件只承载与公网安全直接相关的开关，强制关闭 Swagger / OpenAPI 文档公网暴露，
# 防止 /swagger-ui.html、/v3/api-docs 把控制台接口结构与请求示例交给攻击者。
# SecurityStartupValidator 会在 prod profile 下对未关闭的 Swagger 做 fail-fast 校验。

# 关闭 OpenAPI JSON 端点（/v3/api-docs 及其子路径全部失效）
springdoc.api-docs.enabled=false
# 关闭 Swagger UI 端点（/swagger-ui.html 及其静态资源全部失效）
springdoc.swagger-ui.enabled=false
# try-it-out 按钮在 UI 已下线的前提下无意义，显式置 false 以防配置回滚时单点泄露
springdoc.swagger-ui.try-it-out-enabled=false

# 人机校验：生产环境强制开启 Cloudflare Turnstile（secret-key 必须通过
# CAPTCHA_TURNSTILE_SECRET_KEY 环境变量提供，否则 SecurityStartupValidator fail-fast）
app.captcha.turnstile.enabled=${CAPTCHA_TURNSTILE_ENABLED:true}
